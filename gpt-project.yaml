schema_version: 1
project:
  id: arkitekturmonsterguiden
  name: Arkitekturmönsterguiden
  language: sv
  description: Beslutsorienterad guide för val och granskning av arkitekturmönster
    för system, integration och moln.
  repository: https://github.com/erland/gpt-arkitekturmonsterguiden
analysis:
  profile: standard
  source: user-idea
  characteristics:
    structured_knowledge: true
    repeatable_outputs: true
    moderate_workflow: true
  runtime:
    strategy: peer_candidates
    candidates:
    - runtime_id: chatgpt_chat
      suitability: ready
      activate_by_default: true
      reason: Canonical instruktion, Knowledge och optional webbresearch passar direkt
        i Chat.
    - runtime_id: claude_project
      suitability: ready
      activate_by_default: true
      reason: Project Instructions och Knowledge kan bära hela kärnflödet; aktuell
        produktresearch är plattformsberoende på samma sätt som i övriga runtimes.
    - runtime_id: opencode
      suitability: reduced
      activate_by_default: false
      reason: Kärnanalysen kan köras men lokal workspace/shell-exekvering tillför
        ingen central förmåga för rådgivningsflödet.
    - runtime_id: openai_plugin
      suitability: ready
      activate_by_default: true
      reason: Skills-first passar rådgivningsflödet väl eftersom canonical beteende
        och Knowledge kan bäras utan persistent state, runtime-skript eller custom
        tools.
model_robustness:
  level: guided
  rationale: Flerstegsanalysen behöver en kort operativ kärna och gates men inget
    långlivat state.
  operational_core: true
  explicit_workflow: false
  deterministic_gates: true
  model_compatibility_evals: true
instructions:
  canonical: src/instructions/system.md
  core_contract:
    enabled: true
    required_markers:
    - Identifiera arkitekturdrivande krav
    - Rekommendera den enklaste tillräckliga lösningen
    - Redovisa antaganden och osäkerheter
    - När ett alternativ bör väljas i stället
    - Operativ kärna
    required_runtime_dependencies: []
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
structure:
  conversation_starters:
    path: src/conversation-starters
  runtime_policy:
    path: src/runtime-policy
  schemas:
    path: runtime/schemas
  scripts:
    path: runtime/scripts
  templates:
    path: runtime/templates
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: recommended
      reason: Behövs för aktuella produkt-, standard-, versions- och molntjänstfrågor.
    filesystem:
      read: optional
      write: optional
    shell:
      level: not_required
    code_execution:
      level: not_required
    structured_data:
      level: optional
      reason: Strukturerad JSON kan levereras på uttrycklig begäran.
    persistent_state:
      level: not_required
    external_tools:
      level: optional
    image_generation:
      level: not_required
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    recommendation:
      kind: document
      format: markdown
      requirement: required
      persistence: ephemeral
      multiplicity: one
    adr_draft:
      kind: document
      format: markdown
      requirement: conditional
      condition: Användaren ber om ADR-underlag.
      persistence: ephemeral
      multiplicity: one
    structured_json:
      kind: data
      format: json
      requirement: conditional
      condition: Användaren ber uttryckligen om strukturerad JSON.
      persistence: ephemeral
      multiplicity: one
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: not_required
    persistence: not_required
    portable: false
    separate_from_assistant: false
    description: Kärnuppgiften är rådgivning och kräver inget separat persistent workspace.
  state:
    requirement: not_required
    persistence: not_required
    authority: none
    description: Varje arkitekturanalys kan genomföras utan långlivad state mellan
      sessioner.
  runtime_preferences:
    chat: none
    agent: none
tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools: []
knowledge_architecture:
  canonical_root: knowledge
  custom_gpt:
    priority:
    - knowledge/decision-guide.md
    - knowledge/pattern-model-and-taxonomy.md
    - knowledge/application-and-services.md
    - knowledge/integration-and-messaging.md
    - knowledge/data-and-transactions.md
    - knowledge/resilience-scaling-cloud.md
runtime:
  primary: none
  chat_zip:
    enabled: true
    entrypoint: START-HERE.md
    start_here_template: build-templates/START-HERE.chat.md.tpl
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    validation:
      require_instructions: true
      require_runtime_contract: true
    templates:
      readme: build-templates/README.claude.md.tpl
  openai_plugin:
    enabled: true
    role: peer_distribution
    mode: skills_first
    compatibility: equivalent_runtime_dependent
    entrypoint: skills/arkitekturmonsterguiden/SKILL.md
    web_dependency: host_runtime
    file_input_dependency: host_runtime
    mcp_generated: false
    script_resources: none
  custom_gpt:
    enabled: false
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: identical
      max_files: 20
    templates:
      capabilities: build-templates/capabilities.md.tpl
      compatibility: build-templates/COMPATIBILITY.md.tpl
      readme: build-templates/README.custom-gpt.md.tpl
  plugin:
    enabled: true
    role: peer_distribution
    mode: openai_plugin
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: build-templates/README.plugin.md.tpl
    validation:
      require_manifest: true
      require_skill: true
      require_skill_frontmatter: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: build-templates/README.opencode.md.tpl
    skills:
      enabled: true
      directory: .opencode/skills
      definitions:
      - id: arkitekturrad
        name: arkitekturrad
        description: Välj arkitekturmönster utifrån arkitekturdrivande krav.
    validation:
      require_agents_md: true
      require_runtime_contract: true
development:
  plan: docs/development-plan.md
  status: project-status.yaml
testing:
  manifest: tests/test-manifest.yaml
  manifest_schema: schemas/project-status.schema.json
  eval_case_schema: schemas/eval-case.schema.json
runtime_parity:
  registered_runtimes:
  - chatgpt_chat
  - claude_project
  - opencode
  - openai_plugin
  compared_categories:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool
platform_validation:
  script: scripts/validate_distributions.py
ci:
  enabled: true
  default: true
  workflow: .github/workflows/ci.yml
release:
  github:
    enabled: true
    default: true
    optional: false
    version_source: github_release_tag
    workflow: .github/workflows/release.yml
build:
  deterministic: true
  create_manifest: true
  create_checksums: true
  build_project_zip: true
  build_chat_zip: true
  build_custom_gpt_zip: false
  build_claude_zip: true
  build_opencode_zip: true
  build_plugin_zip: true
build_system:
  model: docs/build-system.md
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
  - project
  - chat
  - claude_project
  - claude_skills
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: <project-id>-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: <project-id>-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
  - build/**
  - dist/**
  - .git/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
skills:
  contract_version: 1
  mode: inferred
  definitions:
  - id: arkitekturrad
    name: arkitekturrad
    description: Beslutsorienterad analys och rekommendation av arkitekturmönster
      för system, integration och moln.
    source: src/instructions/system.md
    references:
    - knowledge/decision-guide.md
    - knowledge/pattern-model-and-taxonomy.md
    - knowledge/response-modes.md
